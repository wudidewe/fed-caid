[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iov-instruction"
version = "1.0.0"
description = "Reproducible federated intrusion-detection benchmarks for in-vehicle CAN and network flows"
license = {file = "LICENSE"}
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "liulu"}]
dependencies = [
    "numpy==2.1.3",
    "pandas==2.2.3",
    "scikit-learn==1.6.1",
    "threadpoolctl==3.5.0",
    "scipy==1.15.3",
    "torch==2.5.1",
    "typing_extensions==4.12.2",
    "matplotlib==3.10.0",
    "psutil==5.9.8",
]
urls = {Repository = "https://github.com/wudidewe/fed-caid", Documentation = "https://github.com/wudidewe/fed-caid/blob/master/README.md"}
keywords = ["intrusion detection", "Internet of Vehicles", "federated learning", "additive secret sharing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
]

[tool.setuptools]
packages = ["src", "src.vendor", "src.fedcaid_resources"]

[tool.setuptools.package-data]
"src.vendor" = ["*.txt", "*.md"]
"src.fedcaid_resources" = ["*.json", "preparation/*/*.json", "preparation/*/*.csv"]
