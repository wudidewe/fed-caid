name: FedCAID checks

on: [push, pull_request]

jobs:
  cpu:
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Run the default launcher without data
        run: python main.py
      - name: Run the synthetic CPU experiment suite
        run: python main.py --smoke
      - run: python -m pip install "setuptools>=68" wheel
      - run: python -m pip wheel --no-deps --no-build-isolation . --wheel-dir wheelhouse
      - run: python tools/check_installed_wheel.py --wheel-dir wheelhouse --resolve-dependencies --cpu-torch
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: fedcaid-checks-${{ matrix.os }}
          path: installed_wheel_check.json
          if-no-files-found: ignore
