name: FedCAID checks

on: [push, pull_request]

jobs:
  cpu:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python main.py
      - run: python -m pip install "setuptools>=68" wheel
      - run: python -m pip wheel --no-deps --no-build-isolation . --wheel-dir wheelhouse
      - run: python tools/check_installed_wheel.py --wheel-dir wheelhouse --resolve-dependencies --cpu-torch
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fedcaid-checks-${{ matrix.os }}
          path: installed_wheel_check.json
